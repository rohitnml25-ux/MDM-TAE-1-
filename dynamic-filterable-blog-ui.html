<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Notes — a filterable blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0EA;
    --paper-raise:#FFFFFF;
    --ink:#1F241F;
    --ink-soft:#535D53;
    --ink-faint:#8B958A;
    --rule:#CBD2C4;
    --teal:#2F6F63;
    --teal-dim:#DCE7E2;
    --brick:#B5503C;
    --gold:#B08628;
    --radius:2px;
    --maxw:1080px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,.serif{
    font-family:'Source Serif 4', Georgia, serif;
  }

  a{color:inherit;}

  ::selection{background:var(--teal); color:#fff;}

  :focus-visible{
    outline:2px solid var(--teal);
    outline-offset:3px;
  }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- Masthead ---------- */
  header.masthead{
    padding:56px 0 26px;
    border-bottom:3px double var(--ink);
  }
  .masthead-inner{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:32px;
    flex-wrap:wrap;
  }
  .brand h1{
    margin:0;
    font-size:2.5rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .brand p{
    margin:6px 0 0;
    font-style:italic;
    color:var(--ink-soft);
    font-size:0.98rem;
  }
  .search-field{
    min-width:260px;
    flex:0 1 320px;
  }
  .search-field label{
    display:block;
    font-size:0.78rem;
    color:var(--ink-faint);
    margin-bottom:6px;
  }
  .search-field .field-row{
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:6px;
  }
  .search-field input{
    border:none;
    background:none;
    outline:none;
    font-family:'Inter',sans-serif;
    font-size:1.02rem;
    color:var(--ink);
    width:100%;
    padding:2px 0;
  }
  .search-field input::placeholder{color:var(--ink-faint);}
  .search-field svg{flex:none; color:var(--ink-faint);}
  .clear-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-faint);
    font-size:1.1rem;
    line-height:1;
    padding:0 2px;
    display:none;
  }
  .clear-btn.show{display:inline-block;}

  /* ---------- Tag filter row ---------- */
  nav.tagbar{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:0;
    padding:16px 0 14px;
    border-bottom:1px solid var(--rule);
  }
  nav.tagbar button{
    background:none;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:0.94rem;
    color:var(--ink-soft);
    padding:6px 14px;
    position:relative;
  }
  nav.tagbar button:not(:last-child)::after{
    content:"";
    position:absolute;
    right:-1px;
    top:50%;
    transform:translateY(-50%);
    height:14px;
    width:1px;
    background:var(--rule);
  }
  nav.tagbar button.active{
    color:var(--teal);
    font-weight:600;
  }
  nav.tagbar button.active::before{
    content:"";
    position:absolute;
    left:14px;
    right:14px;
    bottom:0;
    height:2px;
    background:var(--teal);
  }
  nav.tagbar button:hover{color:var(--ink);}
  nav.tagbar button.active:hover{color:var(--teal);}

  .meta-line{
    padding:14px 0 6px;
    font-size:0.86rem;
    color:var(--ink-faint);
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .meta-line strong{color:var(--ink-soft); font-weight:600;}

  /* ---------- Featured entry ---------- */
  .featured{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:36px;
    padding:26px 0 40px;
    align-items:center;
  }
  .featured .art{
    aspect-ratio:4/3;
    border-radius:var(--radius);
    background:

    position:relative;
    overflow:hidden;
  }

    content:attr(data-glyph);
    position:absolute;
    right:14px;
    bottom:6px;
    font-family:'Source Serif 4',serif;
    font-size:6.4rem;
    font-weight:700;
    color:rgba(255,255,255,.16);
    line-height:1;

    font-size:0.82rem;
    color:var(--teal);
    font-weight:600;
    margin-bottom:10px;
  }
  .featured h2{
    font-size:2.1rem;
    line-height:1.18;
    margin:0 0 14px;
    font-weight:600;
  }
  .featured p.excerpt{
    color:var(--ink-soft);
    font-size:1.04rem;
    margin:0 0 18px;
    max-width:46ch;
  }

    display:flex;
    gap:16px;
    align-items:center;
    font-size:0.84rem;
    color:var(--ink-faint);
  }

  .readtime{
    font-variant-numeric:tabular-nums;
    color:var(--gold);
    font-weight:600;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    column-gap:32px;
  }
  .card{
    border-top:1px solid var(--rule);
    padding:22px 0 24px;
  }
  .card .kicker{
    font-size:0.78rem;
    color:var(--teal);
    font-weight:600;
    margin-bottom:8px;
  }
  .card h3{
    font-size:1.14rem;
    line-height:1.32;
    margin:0 0 8px;
    font-weight:600;
  }
  .card p{
    color:var(--ink-soft);
    font-size:0.92rem;
    margin:0 0 14px;
  }

  /* ---------- Empty state ---------- */
  .empty{
    padding:70px 0 90px;
    text-align:center;
    border-top:1px solid var(--rule);
  }
  .empty p{
    color:var(--ink-soft);
    font-size:1.02rem;
    margin:0 0 18px;
  }
  .empty button{
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    font-weight:600;
    color:var(--teal);
    background:var(--teal-dim);
    border:none;
    border-radius:var(--radius);
    padding:10px 20px;
    cursor:pointer;
  }
  .empty button:hover{background:#cfe1da;}

  footer{
    border-top:3px double var(--ink);
    padding:26px 0 50px;
    color:var(--ink-faint);
    font-size:0.85rem;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;

    .featured{grid-template-columns:1fr;}
    .grid{grid-template-columns:repeat(2,1fr);}
  }

    .wrap{padding:0 18px;}
    header.masthead{padding:36px 0 20px;}
    .brand h1{font-size:1.9rem;}
    .masthead-inner{align-items:flex-start;}
    .grid{grid-template-columns:1fr;}
    nav.tagbar{gap:2px 0;}
    .featured .art{aspect-ratio:16/10;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }

      excerpt: "Two small functions that quietly fix half of your input-lag and scroll-jank bugs, once you know when to reach for each.",
      content: `Every interface that reacts to typing or scrolling eventually runs into the same problem: the browser fires events far more often than you actually need to respond to them. A single search box can emit a keyup event on every keystroke, and a scroll handler can fire dozens of times per second. Calling an expensive function — a network request, a re-render, a layout read — on every one of those events is how pages start to feel sluggish.

Debounce and throttle solve this in two different ways. Debounce waits for a pause in activity before running your function, which is ideal for a search box: you want to wait until the person has stopped typing, not fire a request after every letter. Throttle instead runs your function at most once every fixed interval, which suits a scroll or resize handler where you want steady, regular updates rather than a single delayed one.

A minimal debounce implementation stores a timer id in a closure, clears it on every call, and only lets the wrapped function run once the timer completes uninterrupted. A minimal throttle instead tracks the last time the function ran and skips calls that arrive too soon after it. Neither implementation is more than a dozen lines, but picking the wrong one for the job is a common source of subtly broken interfaces — a debounced scroll listener feels laggy, and a throttled search box fires requests you don't need.

The practical rule of thumb: debounce anything that represents a person finishing an action (typing, resizing a window before settling), and throttle anything that represents an ongoing stream you want to sample at a steady rate (scrolling, dragging, mouse movement).

There's a middle-ground pattern worth knowing too: a leading-edge debounce, which runs the function immediately on the first call and then ignores subsequent calls until the pause completes. This suits button clicks where you want an instant response but also want to guard against accidental double-submits — the opposite priority from a search box, where waiting feels natural but instant double-firing would just mean duplicate requests.

Libraries like Lodash ship battle-tested versions of both with extra options — a maximum wait time for debounce, or leading and trailing execution flags for throttle — and reaching for those in production code is usually wiser than hand-rolling your own once the requirements grow past the basic case. But writing the minimal version yourself, even once, is what makes the difference between the two click permanently rather than staying a pair of terms you mix up.`

      excerpt: "map, filter and reduce cover almost everything you need to transform a list, once the mental model clicks.",
      content: `Most day-to-day JavaScript work is really just reshaping lists of things: turning an array of user records into an array of names, keeping only the ones that match a condition, or collapsing a list down into a single total. Three methods handle nearly all of it, and once the mental model clicks, manual for-loops start to feel unnecessary for this kind of work.

map takes an array and returns a new array of the same length, with every item transformed by a function you provide. It's the tool for "I have this, I want that, one-to-one." filter also returns a new array, but keeps only the items for which your function returns true — it never changes the shape of an item, only whether it survives. reduce is the odd one out: it walks the array while carrying an accumulator value forward, and can produce anything from a single number to a brand-new object, which makes it the most flexible and also the easiest to misuse for something a map or filter would express more clearly.

Chaining these together is where they really shine. Filtering a list of articles down to a tag, then mapping the remaining items to just their titles, reads as two clear, named steps rather than one loop with several responsibilities mixed together. The cost is a little more memory, since each step returns a new array, but for UI-sized datasets that trade-off is almost always worth the clarity.

A good habit: reach for reduce only when map and filter genuinely can't express what you need, since a five-line reduce is often a two-line filter-then-map in disguise.

A few other methods round out the toolkit without needing their own deep dive. find returns the first item matching a condition, or undefined if nothing matches, which beats filtering and then grabbing index zero. some and every answer yes/no questions about a whole array — "does at least one item match" and "do all items match" respectively — and short-circuit as soon as the answer is known, so they're cheap even on large arrays. sort deserves a specific warning: it mutates the array in place and sorts elements as strings by default, which means numeric arrays sort in a surprising order unless you pass an explicit comparator function.

Together, map, filter, reduce, find, some, every, and a careful sort cover the overwhelming majority of list-shaping code you'll write day to day, and knowing which one signals your intent most clearly is a skill that pays off every time someone else has to read your code later — including future you.`

      content: `A live search filter looks simple from the outside — you type, and the list narrows — but it's a good small project for understanding how state and rendering fit together in plain JavaScript. The core idea is to never mutate your original data. Instead, you keep one source array untouched, and every time the input changes, you compute a fresh filtered array from it and re-render the results from scratch.

The input listener is the trigger. On every input event, you read the current value, lowercase it for a case-insensitive match, and run it against each item's searchable fields — usually a title and maybe a short excerpt. Array.filter is a natural fit here: return true for items whose title or excerpt includes the search term, and let everything else drop out.

Rendering is the second half. Rather than trying to patch the existing DOM nodes, it's far simpler to clear the results container and rebuild it from the filtered array on every keystroke. For small to medium lists — tens or a few hundred items — this is fast enough that the person typing never notices any lag, and the code stays much easier to reason about than manual DOM diffing.

The last detail that makes it feel polished is the empty state: when the filtered array has zero items, don't just render nothing — show a message that explains no results matched, and ideally a way to clear the search. An interface that goes silent when a search fails feels broken, even when it's technically working exactly as coded.

Two refinements make the basic version feel production-ready. First, debounce the input listener so filtering only runs once typing pauses for a short moment — otherwise a fast typist triggers a full re-render on every single keystroke, which is wasted work for lists of any real size. Second, keep the search term itself visible somewhere in the results header, so if someone glances away and back, they immediately understand why the list looks the way it does rather than wondering if something is broken.

It's also worth deciding early whether search should match the whole word, a substring anywhere, or only the start of a word, since each gives a noticeably different feel. Substring matching (used throughout this example) is the most forgiving and the easiest to implement with String.includes, and it's usually the right default unless your dataset is large enough that a proper search index becomes worthwhile.

      content: `CSS Grid quietly removed one of the most tedious parts of front-end work: writing media queries just to change how many columns a row of cards shows at different widths. The property that does the heavy lifting is repeat combined with auto-fit or auto-fill inside minmax.

A single line — grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) — tells the browser to fit as many 240-pixel-minimum columns as will comfortably fit the container, and to stretch them evenly to fill any remaining space. Resize the browser window and the grid recalculates the column count on its own, no breakpoints required. auto-fit and auto-fill behave almost identically, but differ in what happens with extra space when there are fewer items than columns: auto-fit collapses the empty tracks to zero width, while auto-fill leaves them present but empty, which matters if you want your last row of cards to stay left-aligned rather than stretching to fill the row.

Gaps between cards are handled by the gap property directly on the grid, which replaces the old trick of applying margins to every card and then subtracting them back out with negative margins on the container. It also plays cleanly with wrapping — the gap only appears between items, never on the outer edge.

The combination of auto-fit, minmax, and gap covers the vast majority of "responsive card grid" requirements on the web today, and it's worth reaching for before writing a single custom breakpoint.

One card sizing detail trips people up the first time: minmax's second value of 1fr doesn't mean "one column," it means "grow to fill whatever fraction of remaining space is available," and it's what allows the last, possibly incomplete row to stretch its cards evenly rather than leaving one narrow orphan card sitting awkwardly on its own. If you'd rather that final row stay left-aligned at the card's natural width instead of stretching, switching auto-fit to auto-fill produces that behavior with no other changes.

Grid, by contrast, is designed for two-dimensional layout: rows and columns at the same time, with explicit control over both. Anything that resembles a table, a dashboard, or a gallery of equally-sized cards is a strong signal to reach for Grid, because it lets you define the whole structure — column widths, row heights, gaps — in one place, rather than nesting flex containers inside each other to fake two dimensions.

A useful rule of thumb: if you catch yourself nesting a flex container inside another flex container just to align things both horizontally and vertically, that's usually a sign the layout wants to be a grid instead. Conversely, if you're just trying to space out three buttons or vertically center some text next to an icon, reaching for Grid is often more setup than the problem needs.

In practice, most real pages use both — Grid for the page-level or section-level structure, and Flexbox for the smaller components that live inside each grid cell.`

The cases where useMemo earns its keep are recalculations that are genuinely expensive relative to a render: filtering or sorting a large list, running a non-trivial transformation over data, or computing a derived value that's then passed as a prop into a component wrapped in React.memo, where a new object or array reference on every render would defeat the memoization entirely.

That last case is the one people miss most often. If a child component is memoized specifically to avoid re-rendering, but its parent passes it a brand-new array or object literal every render, the memoization is pointless — the reference changes every time even if the contents are identical. Wrapping that value in useMemo, keyed on its real dependencies, is what actually lets the child skip re-rendering.

A reasonable default: don't add useMemo speculatively. Add it when you've noticed an actual slow render, or when you're passing a computed value into a memoized child and need a stable reference.`

      content: `A pretrained language model arrives with its weights already set from training on a huge, general corpus of text. Fine-tuning takes that same model and continues training it, usually for a much shorter time and on a much smaller, more specific dataset, so its behavior shifts toward the patterns in that new data without starting over from scratch.

What actually changes is the same thing that changed during the original training: the numerical weights inside the network are nudged, layer by layer, by gradient descent, based on how wrong the model's predictions were on the fine-tuning examples. Nothing structural changes — the architecture, the number of layers, the size of the model — only the specific values stored in those layers.

This is why fine-tuning is so much cheaper than training from scratch. The model already "knows" grammar, general facts, and broad reasoning patterns from pretraining; fine-tuning only has to teach it a narrower skill or style on top of that foundation, such as following a particular response format, adopting a specific tone, or getting better at a narrow task like classifying support tickets.

It's also why fine-tuning can go wrong in specific ways. Train on too narrow or repetitive a dataset, and the model can lose some of its general ability in exchange for over-fitting to the fine-tuning examples — a trade-off usually called catastrophic forgetting. Good fine-tuning setups keep the dataset diverse enough, and the learning rate low enough, that the model gains the new skill without losing too much of what it already knew.

There's also a distinction worth keeping straight between fine-tuning and the two other common ways of adapting a model's behavior. Prompting changes nothing about the weights at all — it just gives the existing model more context or instructions at request time, which is why its effects disappear the moment you stop including that context. Retrieval, similarly, leaves the weights untouched and instead feeds relevant documents into the prompt so the model can reference specific information it wasn't trained on. Fine-tuning is the only one of the three that permanently changes what the model itself has learned, which makes it the right tool when you need a lasting change in style or skill, and the wrong, most expensive tool when a good prompt or a retrieved document would have done the job.`

      excerpt: "Precision, recall, and the matrix they both come from — explained with one running example.",
      content: `A confusion matrix is just a table that compares what a classifier predicted against what was actually true, and almost every other classification metric is calculated directly from its four corners. For a simple yes/no classifier — say, "is this email spam" — the matrix has four cells: true positives (predicted spam, actually spam), false positives (predicted spam, actually not), false negatives (predicted not spam, actually spam), and true negatives (predicted not spam, actually not).

Precision answers "of everything I flagged as spam, how much actually was spam," and is calculated as true positives divided by all predicted positives. It matters most when a false positive is costly — flagging a real, important email as spam is annoying, so a spam filter usually wants high precision. Recall answers a different question: "of all the actual spam that existed, how much did I catch," calculated as true positives divided by all actual positives. It matters most when missing a positive is the expensive mistake, such as a medical test that should rarely let a real case slip through undetected.

These two metrics trade off against each other in most real systems. A filter that flags everything as spam gets perfect recall — it never misses real spam — but terrible precision, since it also flags every legitimate email. Tightening the threshold to only flag the most obvious spam raises precision but risks letting subtler spam through, lowering recall.

Reading a confusion matrix well means resisting the pull toward a single "accuracy" number, which can look excellent on a lopsided dataset while hiding a model that never correctly identifies the rare, important class.`

      excerpt: "The difference between a correct answer and a hireable one usually comes down to how you got there.",
      content: `Technical interviewers are rarely just checking whether your final answer matches a number in their notes. Most are trying to build a mental model of how you think under uncertainty: whether you clarify assumptions before diving in, whether you notice and name trade-offs, and whether you can recover gracefully when your first approach turns out to be wrong.

That's why narrating your thinking out loud matters more than most candidates expect. Silently staring at a problem for two minutes and then producing a correct answer gives the interviewer almost nothing to evaluate except the answer itself. Talking through your assumptions, your first idea, why you're rejecting it, and what you're trying instead gives them the actual signal they're trying to collect — and it often helps you think more clearly too, since articulating a plan out loud tends to expose gaps in it faster than thinking silently does.

Asking clarifying questions before writing any code is another underrated signal. A question like "should this handle duplicate entries" or "what should happen with an empty input" shows that you're thinking about the problem's edges before committing to a solution, which is exactly the habit that prevents bugs in real work.

Finally, how you respond when you're told your solution is wrong, or when a test case fails, tends to matter as much as getting it right the first time. Treating that moment as useful information rather than a personal failure — debugging out loud, adjusting the approach, staying calm — is often the single strongest signal in the whole interview.

It's worth preparing for this deliberately, because it rarely comes naturally under pressure. Before an interview, it can help to practice solving a problem slightly wrong on purpose — get partway through with an approach you know will hit a snag, and practice narrating the discovery of that snag and the pivot to something better, rather than practicing only problems you can solve cleanly start to finish. That rehearsal of recovery, not just of correctness, is what tends to transfer into the real interview room, where almost nobody's first idea turns out to be exactly right anyway.`
    }
  ];

  const tagColors = {
    "JavaScript": "#2F6F63",
    "CSS": "#B08628",
    "React": "#2F6F63",
    "AI/ML": "#B5503C",
    "Career": "#B08628"
  };

  function wordCount(text){
    return text.trim().split(/\s+/).length;
  }
  function readTime(text){
    const words = wordCount(text);
    return Math.max(1, Math.round(words / 200));
  }
  function formatDate(iso){
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  const tags = ["All", ...Array.from(new Set(articles.map(a => a.tag)))];
  let state = { search: "", tag: "All" };

  const tagbar = document.getElementById("tagbar");
  const searchInput = document.getElementById("search");
  const clearBtn = document.getElementById("clearBtn");
  const resultsEl = document.getElementById("results");
  const resultsLine = document.getElementById("resultsLine");
  const activeFilters = document.getElementById("activeFilters");

  function renderTagbar(){
    tagbar.innerHTML = "";
    tags.forEach(tag => {
      const btn = document.createElement("button");
      btn.textContent = tag;
      btn.type = "button";
      if (tag === state.tag) btn.classList.add("active");
      btn.addEventListener("click", () => {
        state.tag = tag;
        renderTagbar();
        renderResults();
      });
      tagbar.appendChild(btn);
    });
  }

  function getFiltered(){
    const q = state.search.trim().toLowerCase();
    return articles.filter(a => {
      const matchesTag = state.tag === "All" || a.tag === state.tag;
      const matchesSearch = !q ||
        a.title.toLowerCase().includes(q) ||
        a.excerpt.toLowerCase().includes(q) ||
        a.content.toLowerCase().includes(q);
      return matchesTag && matchesSearch;
    });
  }

  function cardHTML(a){
    const rt = readTime(a.content);
    return `
      <article class="card">
        <div class="kicker">${a.tag}</div>
        <h3>${a.title}</h3>
        <p>${a.excerpt}</p>
        <div class="entry-meta">
          <span>${formatDate(a.date)}</span>
          <span class="dot"></span>
          <span class="readtime">${rt} min read</span>
        </div>
      </article>
    `;
  }

  function featuredHTML(a){
    const rt = readTime(a.content);
    return `
      <section class="featured">
        <div class="art" data-glyph="${a.glyph}" style="--art-a:${a.colors[0]};--art-b:${a.colors[1]}"></div>
        <div>
          <div class="kicker">${a.tag}</div>
          <h2>${a.title}</h2>
          <p class="excerpt">${a.excerpt}</p>
          <div class="entry-meta">
            <span>${formatDate(a.date)}</span>
            <span class="dot"></span>
            <span class="readtime">${rt} min read</span>
          </div>
        </div>
      </section>
    `;
  }

  function renderResults(){
    const filtered = getFiltered();

    resultsLine.textContent = `Showing ${filtered.length} of ${articles.length} entries`;

    const bits = [];
    if (state.search.trim()) bits.push(`search: “${state.search.trim()}”`);
    if (state.tag !== "All") bits.push(`tag: ${state.tag}`);
    activeFilters.textContent = bits.length ? bits.join("  ·  ") : "";

    clearBtn.classList.toggle("show", !!state.search);

    if (filtered.length === 0){
      resultsEl.innerHTML = `
        <div class="empty">
          <p>No entries match your filters. Try a different search term or tag.</p>
          <button id="resetBtn" type="button">Clear filters</button>
        </div>
      `;
      document.getElementById("resetBtn").addEventListener("click", () => {
        state = { search: "", tag: "All" };
        searchInput.value = "";
        renderTagbar();
        renderResults();
      });
      return;
    }

    const [first, ...rest] = filtered;
    let html = featuredHTML(first);
    if (rest.length){
      html += `<div class="grid">${rest.map(cardHTML).join("")}</div>`;
    }
    resultsEl.innerHTML = html;
  }

  searchInput.addEventListener("input", (e) => {
    state.search = e.target.value;
    renderResults();
  });

  clearBtn.addEventListener("click", () => {
    state.search = "";
    searchInput.value = "";
    searchInput.focus();
    renderResults();
  });

  document.getElementById("year").textContent = new Date().getFullYear();

  renderTagbar();
  renderResults();
})();
</script>

</body>
</html>
